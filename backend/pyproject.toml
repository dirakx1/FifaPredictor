[project]
name = "fifapredictor"
version = "1.0.0"
description = "FIFA World Cup 2026 prediction engine — fork of MiroFish"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
    "numpy>=2.2.0",
    "tqdm>=4.67.0",
    "rich>=13.9.0",
    "yt-dlp>=2025.1.0",
    "google-api-python-client>=2.157.0",
    "cachetools>=5.5.0",
    "aiohttp>=3.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
